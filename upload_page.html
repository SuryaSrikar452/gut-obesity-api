<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload Your Sample</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #F7FBF8;
    color: #1B2E1D;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .card {
    background: #fff;
    border: 1px solid #66BB6A;
    border-radius: 16px;
    padding: 32px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    text-align: center;
  }
  h1 { font-size: 22px; margin-bottom: 8px; color: #2E7D32; }
  p.sub { color: #5B6E5D; font-size: 14px; margin-bottom: 24px; }
  input[type=file] {
    width: 100%;
    padding: 12px;
    border: 1px dashed #66BB6A;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  button {
    width: 100%;
    padding: 12px;
    background: #2E7D32;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { background: #A5D6A7; cursor: not-allowed; }
  #msg { margin-top: 16px; font-size: 14px; display: none; padding: 10px; border-radius: 8px; }
  #msg.ok { background: #E8F5E9; color: #2E7D32; display: block; }
  #msg.err { background: #FDECEA; color: #D32F2F; display: block; }
  #spinner { display: none; margin-top: 12px; font-size: 13px; color: #5B6E5D; }
</style>
</head>
<body>
  <div class="card">
    <h1>Upload Your Sample</h1>
    <p class="sub">Select your gut microbiome CSV file to analyze.</p>
    <form id="uploadForm">
      <input type="file" id="csvFile" accept=".csv" required>
      <button type="submit" id="submitBtn">Upload &amp; Analyze</button>
    </form>
    <div id="spinner">Processing, please wait...</div>
    <div id="msg"></div>
  </div>

  <script>
    const deviceId = "__DEVICE_ID__";
    const form = document.getElementById('uploadForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const msg = document.getElementById('msg');

    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const file = document.getElementById('csvFile').files[0];
      if (!file) return;

      msg.className = ''; msg.style.display = 'none';
      submitBtn.disabled = true;
      spinner.style.display = 'block';

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch('/upload/' + deviceId, { method: 'POST', body: formData });
        const data = await res.json();
        spinner.style.display = 'none';
        submitBtn.disabled = false;

        if (!res.ok) {
          msg.textContent = data.error || "Something went wrong. Please try again.";
          msg.className = 'err';
        } else {
          msg.textContent = "Uploaded! Check your device screen for results.";
          msg.className = 'ok';
          form.reset();
        }
      } catch (err) {
        spinner.style.display = 'none';
        submitBtn.disabled = false;
        msg.textContent = "Network error. Please try again.";
        msg.className = 'err';
      }
    });
  </script>
</body>
</html>
